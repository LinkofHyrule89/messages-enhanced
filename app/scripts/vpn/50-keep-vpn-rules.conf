# /etc/systemd/networkd.conf.d/50-keep-vpn-rules.conf
# systemd-networkd removes routing rules/routes it didn't create whenever it
# reconfigures an interface (e.g. the GCP guest agent re-applying netplan),
# which silently drops wg-quick's policy rules for the VPN. Leave them alone.
[Network]
ManageForeignRoutingPolicyRules=no
ManageForeignRoutes=no
