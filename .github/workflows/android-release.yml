name: Android Release

# Android tags are android-v*. Web tags stay v* and are published by release.yml.
# This release is marked latest so /releases/latest stays on the newest Android build.

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

defaults:
  run:
    working-directory: android

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Firebase is configured at runtime from the server. No google-services.json is required.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keys
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keys/release.jks

      - name: Write keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          umask 077
          cat > keystore.properties <<EOF
          storeFile=keys/release.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Assemble release
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect APK and changelog notes
        run: |
          tag="${GITHUB_REF_NAME}"
          src="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$src" ]; then
            echo "Release APK was not produced" >&2
            exit 1
          fi
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -n 1)"
          if [ -z "$apksigner" ] || ! "$apksigner" verify "$src" >/tmp/apk-verify.txt 2>&1; then
            echo "Release APK is not signed" >&2
            exit 1
          fi
          cp "$src" "messages-enhanced-${tag}.apk"
          awk -v header="## ${tag}" '
            $0 == header { found = 1; capture = 1; next }
            capture && /^## / { capture = 0 }
            capture { lines[++n] = $0 }
            END {
              if (!found) exit 2
              start = 1
              end = n
              while (start <= end && lines[start] ~ /^[[:space:]]*$/) start++
              while (end >= start && lines[end] ~ /^[[:space:]]*$/) end--
              for (i = start; i <= end; i++) print lines[i]
            }
          ' CHANGELOG.md > release-notes.md || {
            echo "CHANGELOG.md has no section for ${tag}" >&2
            exit 1
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/messages-enhanced-${{ github.ref_name }}.apk
          body_path: android/release-notes.md
          make_latest: true
